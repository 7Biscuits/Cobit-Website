<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Page Not Found | CoBit</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0B1219;
      --pn: #121D28;
      --bd: #223243;
      --tx: #E7F1F8;
      --sf: #A9BDCC;
      --ac: #4FA8DE;
      --ac2: #7CC4F0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--tx);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(800px 400px at 50% 30%, rgba(79, 168, 222, 0.15), transparent 70%), var(--bg);
    }
    .card {
      background: var(--pn);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: clamp(32px, 6vw, 48px) clamp(24px, 5vw, 40px);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      font: 700 0.82rem 'Space Grotesk', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ac);
      background: rgba(79, 168, 222, 0.12);
      border: 1px solid rgba(79, 168, 222, 0.3);
      padding: 6px 14px;
      border-radius: 99px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.1;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      color: var(--sf);
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 99px;
      padding: 12px 22px;
      font: 600 0.92rem 'Inter', sans-serif;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--ac);
      color: #06121C;
      border: 1px solid var(--ac);
    }
    .btn-primary:hover {
      background: var(--ac2);
      border-color: var(--ac2);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #1A2836;
      color: #fff;
      border: 1px solid var(--bd);
    }
    .btn-secondary:hover {
      border-color: var(--ac);
      color: var(--ac);
      transform: translateY(-2px);
    }
    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">404 Error</span>
    <h1>Lost in the city?</h1>
    <p>The landmark or page you're looking for doesn't exist or has moved.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to City</a>
      <a href="/admin" class="btn btn-secondary">Admin Portal</a>
    </div>
  </div>
</body>
</html>
